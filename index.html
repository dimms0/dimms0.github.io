<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>dimms</title>
    <meta name="keywords" content="dimms, software">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Interactive Canvas Background -->
    <canvas id="particle-canvas"></canvas>
    
    <!-- Background Ambient Glowing Orbs -->
    <div class="ambient-glow orb-1"></div>
    <div class="ambient-glow orb-2"></div>
    <div class="ambient-glow orb-3"></div>

    <div class="wrapper">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-text">dimms</span>
            </div>
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span class="badge-text">Under Development</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="main-title">
                Coming<br>
                <span class="highlight-gradient">Soon</span>
            </h1>
        </main>

        <!-- Footer -->
        <footer>
            <div class="footer-group">
                <div class="footer-links">
                    <a href="mailto:info@dimms.gr" class="footer-link-item" title="Contact Us">
                        <i class="fa-regular fa-envelope"></i>
                        <span>info@dimms.gr</span>
                    </a>
                </div>
                
                <div class="social-icons">
                    <a href="https://github.com/dimms0" class="social-btn" aria-label="GitHub" title="GitHub"><i class="fa-brands fa-github"></i></a>
                </div>
            </div>
            
            <div class="copyright">
                &copy; <span id="year">2026</span> dimms. All rights reserved.
            </div>
        </footer>
    </div>

    <!-- Main JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
